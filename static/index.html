<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATC Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0b0f12; --panel:#11171c; --panel2:#161e25; --line:#232e37; --text:#dbe4ea; --dim:#7b8b97;
  --atc:#f2b33d; --pilot:#4cc9f0; --ok:#5fd38d; --bad:#f2695c; --accent:#9be564;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:#3a4a57}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b1408;font-weight:600}
button.on{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pilot);outline-offset:1px}

header{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:6px}
.brand b{font:700 17px var(--mono);letter-spacing:.06em}
.brand span{color:var(--dim);font-size:12.5px}
.pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);padding:4px 9px;border:1px solid var(--line);border-radius:99px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#49545d;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--atc)} .dot.err{background:var(--bad)}
.meter{width:74px;height:8px;background:#0a0d10;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0;background:var(--dim);transition:width .12s linear}
.meter.talk i{background:var(--accent)}
.spacer{flex:1}
.controls{display:flex;gap:7px;flex-wrap:wrap}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,470px);min-height:0}
#map{background:#0a0d10;min-height:0}
.leaflet-container{background:#0a0d10;font:inherit}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.72) contrast(.88) saturate(.35)}
.leaflet-control-attribution{background:rgba(11,15,18,.7)!important;color:#5d6b76!important;font-size:10px}
.leaflet-control-attribution a{color:#7b8b97!important}
.leaflet-bar a{background:var(--panel2);color:var(--text);border-color:var(--line)}

.ac{position:relative;width:0;height:0}
.ac svg{position:absolute;left:-11px;top:-11px;width:22px;height:22px;fill:#8fa3b1;stroke:#0b0f12;stroke-width:1.2}
.ac.low svg{fill:#dbe4ea}
.ac.talked svg{fill:var(--atc)}
.ac.sel svg{fill:var(--accent)}
.ac .lbl{position:absolute;left:13px;top:-9px;font:11px/1.25 var(--mono);color:#9fb0bc;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000}
.ac.talked .lbl,.ac.sel .lbl{color:#fff}
.ac .ring{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;border:2px solid var(--atc);opacity:0;pointer-events:none}
.ac.live .ring{animation:ping 1.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.ac.live .ring{animation:none;opacity:.8}}

#card{position:absolute;left:12px;bottom:22px;z-index:500;background:rgba(17,23,28,.95);border:1px solid var(--line);border-radius:8px;padding:11px 13px;min-width:230px;max-width:300px;display:none}
#card h3{margin:0 0 2px;font:700 17px var(--mono)}
#card .sub{color:var(--dim);font-size:12.5px;margin-bottom:8px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
#card dt{color:var(--dim)} #card dd{margin:0;font-family:var(--mono)}
#card button{margin-top:9px;padding:3px 9px;font-size:12px}
.mapwrap{position:relative;min-height:0;display:grid}

aside{display:grid;grid-template-rows:auto auto 1fr;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.bar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.bar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 9px;font:inherit}
.chips{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 9px;cursor:pointer;background:none;font-size:12px;color:var(--dim)}
.chip.active{color:var(--text);border-color:var(--dim)}
#acc{margin-left:auto;font-family:var(--mono)}
#feed{overflow-y:auto;min-height:0}
.tx{padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.tx.ATC{border-left-color:var(--atc)} .tx.PILOT{border-left-color:var(--pilot)}
.tx.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#1d2a22}100%{background:transparent}}
.tx .top{display:flex;gap:8px;align-items:center;font:12px var(--mono);color:var(--dim)}
.role{font-weight:700;letter-spacing:.05em}
.ATC .role{color:var(--atc)} .PILOT .role{color:var(--pilot)}
.flight{color:var(--text);cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;font:600 12px var(--mono)}
.flight:hover{border-color:var(--accent)}
.unas{font-style:italic}
.tx .meta{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .say{margin-top:4px;font-size:14.5px;overflow-wrap:anywhere}
.tx .say mark{background:none;color:var(--accent);font-weight:600}
.tx.none .say{color:#a9b6c0}
.ib{background:none;border:none;padding:1px 5px;color:var(--dim);font-size:13px;border-radius:4px}
.ib:hover{color:var(--text);background:var(--panel2)}
.ib.ok.set{color:var(--ok)} .ib.bad.set{color:var(--bad)}
.empty{padding:26px 18px;color:var(--dim);font-size:13.5px}
.empty b{color:var(--text)}
.empty ol{padding-left:18px;margin:8px 0}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 6px} dialog p{color:var(--dim);font-size:13px;margin:0 0 10px}
dialog input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px 10px;font:13px var(--mono)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
dialog label{margin-right:auto;font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
dialog label input{width:auto}

@media (max-width:820px){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .mapwrap{height:46vh}
  aside{border-left:none;border-top:1px solid var(--line);height:70vh}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b id="apt">ATC RADAR</b><span id="aptsub"></span></div>
  <div class="pill" title="Audio source"><span class="dot" id="srcdot"></span><span id="srctxt">no audio source</span><span class="meter" id="meter"><i></i></span></div>
  <div class="pill" title="Speech model"><span class="dot warn" id="mdldot"></span><span id="mdltxt">loading model</span></div>
  <div class="pill" title="Live aircraft positions"><span class="dot" id="acdot"></span><span id="actxt">0 aircraft</span></div>
  <div class="spacer"></div>
  <div class="controls">
    <button class="primary" id="btnTab">Capture tab audio</button>
    <button id="btnMic">Mic / line-in</button>
    <button id="btnUrl">Stream or file…</button>
    <button id="btnStop" hidden>Stop</button>
  </div>
</header>
<main>
  <div class="mapwrap">
    <div id="map"></div>
    <div id="card"></div>
  </div>
  <aside>
    <div class="bar"><input id="q" type="search" placeholder="Search transcripts or callsigns" aria-label="Search transcripts"></div>
    <div class="chips">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="matched">Matched</button>
      <button class="chip" data-f="none">Unassigned</button>
      <button class="chip" id="selchip" hidden></button>
      <span id="acc" title="Your hand checks: correct / checked"></span>
    </div>
    <div id="feed" aria-live="polite"></div>
  </aside>
</main>

<dialog id="dlg">
  <h3>Stream URL or audio file</h3>
  <p>An Icecast/MP3 stream you run (for example RTLSDR-Airband), or a path to a recording on this machine as WSL sees it, e.g. <code>/mnt/c/Users/you/tower.mp3</code>.</p>
  <input id="dlgval" placeholder="http://host:8000/tower  or  /mnt/c/…/recording.mp3" aria-label="Stream URL or file path">
  <div class="row">
    <label><input type="checkbox" id="dlgfast"> process a file as fast as possible</label>
    <button id="dlgcancel">Cancel</button><button class="primary" id="dlggo">Start</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cfg, map, txs = [], markers = {}, acs = {}, selected = null, filter = "all", talkedAt = {}, audioEl = null;

// ---------- map ----------
const PLANE = '<svg viewBox="0 0 24 24"><path d="M12 1.5c.9 0 1.5 1 1.5 2.4v5.2l8 4.9v2.1l-8-2.5v4.9l2.6 1.9v1.6L12 20.9 7.9 22v-1.6l2.6-1.9v-4.9l-8 2.5V14l8-4.9V3.9c0-1.4.6-2.4 1.5-2.4z"/></svg>';
function altText(a){ return a.alt_baro === "ground" ? "GND" : a.alt_baro == null ? "" : String(Math.round(a.alt_baro/100)).padStart(3,"0"); }
function acName(a){ return a.flight || a.r || a.hex.toUpperCase(); }
function icon(a){
  const now = Date.now()/1000, t = talkedAt[a.hex] || 0;
  const cls = ["ac", (a.alt_baro === "ground" || a.alt_baro < 8000) ? "low" : "", now - t < 300 ? "talked" : "", now - t < 12 ? "live" : "", selected === a.hex ? "sel" : ""].join(" ");
  return L.divIcon({className:"", html:`<div class="${cls}"><div class="ring"></div><div style="transform:rotate(${a.track||0}deg);position:absolute"><div style="position:relative">${PLANE}</div></div><div class="lbl">${esc(acName(a))}<br>${altText(a)} ${esc(a.t||"")}</div></div>`});
}
function drawTraffic(list){
  acs = Object.fromEntries(list.map(a => [a.hex, a]));
  for (const a of list){
    if (!markers[a.hex]) markers[a.hex] = L.marker([a.lat,a.lon], {icon:icon(a), keyboard:false}).addTo(map).on("click", () => select(a.hex));
    else { markers[a.hex].setLatLng([a.lat,a.lon]); markers[a.hex].setIcon(icon(a)); }
  }
  for (const h of Object.keys(markers)) if (!acs[h]) { map.removeLayer(markers[h]); delete markers[h]; }
  $("#actxt").textContent = `${list.length} aircraft`;
  if (selected) drawCard();
}
function select(hex){
  selected = selected === hex ? null : hex;
  for (const h in markers) if (acs[h]) markers[h].setIcon(icon(acs[h]));
  drawCard(); render();
}
function drawCard(){
  const c = $("#card"), chip = $("#selchip");
  if (!selected){ c.style.display = "none"; chip.hidden = true; return; }
  const a = acs[selected], last = txs.find(t => t.hex === selected), i = a || (last && last.info) || {};
  const r = i.route, n = txs.filter(t => t.hex === selected).length, name = i.flight || i.r || selected.toUpperCase();
  c.style.display = "block";
  c.innerHTML = `<h3>${esc(name)}</h3><div class="sub">${esc(r && r.airline || (a ? "" : "no longer in range"))}</div><dl>
    ${r ? `<dt>Route</dt><dd>${esc(r.from||"?")} → ${esc(r.to||"?")}</dd>` : ""}
    <dt>Type</dt><dd>${esc(i.t||"—")}</dd><dt>Tail</dt><dd>${esc(i.r||"—")}</dd>
    <dt>Altitude</dt><dd>${i.alt_baro === "ground" ? "on ground" : i.alt_baro != null ? Number(i.alt_baro).toLocaleString()+" ft" : "—"}</dd>
    <dt>Speed</dt><dd>${i.gs != null ? Math.round(i.gs)+" kt" : "—"}</dd><dt>On frequency</dt><dd>${n} transmission${n===1?"":"s"}</dd></dl>
    <button onclick="select('${selected}')">Clear selection</button>`;
  chip.hidden = false; chip.textContent = `${name} ✕`; chip.className = "chip active";
}
$("#selchip").onclick = () => select(selected);

// ---------- feed ----------
function txHtml(t, fresh){
  const d = new Date(t.ts*1000), time = d.toLocaleTimeString([], {hour12:false});
  const i = t.info, r = i && i.route;
  const meta = t.hex ? [i && i.t, r && `${r.from||"?"}→${r.to||"?"}`, i && (i.alt_baro === "ground" ? "on ground" : i.alt_baro != null ? Number(i.alt_baro).toLocaleString()+" ft" : null)].filter(Boolean).join(" · ") : "";
  let say = esc(t.text);
  const who = t.hex ? `<button class="flight" onclick="select('${t.hex}')" title="Show on map">${esc(t.callsign)}</button>`
                    : `<span class="unas">unassigned${t.mention ? " · heard "+esc(t.mention) : ""}</span>`;
  return `<div class="tx ${t.role} ${t.hex ? "" : "none"} ${fresh ? "new" : ""}" data-id="${t.id}">
    <div class="top"><span>${time}</span><span>${esc(t.feed)}</span><span class="role">${t.role === "?" ? "—" : t.role}</span>${who}
      <span class="meta">${esc(meta)}</span>${t.hex ? `<span title="Match confidence">${Math.round(t.conf*100)}%</span>` : ""}
      <button class="ib" title="Play this transmission" aria-label="Play" onclick="play(${t.id})">▶</button>
      <button class="ib ok ${t.verdict==="ok"?"set":""}" title="Match is right" aria-label="Mark correct" onclick="verdict(${t.id},'ok')">✓</button>
      <button class="ib bad ${t.verdict==="bad"?"set":""}" title="Match is wrong" aria-label="Mark wrong" onclick="verdict(${t.id},'bad')">✗</button></div>
    <div class="say">${say}</div></div>`;
}
function visible(t){
  if (selected && t.hex !== selected) return false;
  if (filter === "matched" && !t.hex) return false;
  if (filter === "none" && t.hex) return false;
  const q = $("#q").value.trim().toLowerCase();
  return !q || (t.text + " " + (t.callsign||"") + " " + (t.mention||"")).toLowerCase().includes(q);
}
function render(freshId){
  const rows = txs.filter(visible).slice(0, 250);
  $("#feed").innerHTML = rows.length ? rows.map(t => txHtml(t, t.id === freshId)).join("") : `<div class="empty">${txs.length ? "Nothing matches this filter." :
    `<b>No transmissions yet.</b><ol><li>Open an ATC audio stream you're listening to in another browser tab.</li><li>Click <b>Capture tab audio</b>, pick that tab and tick “Also share tab audio”.</li><li>Each transmission appears here, matched to an aircraft on the map.</li></ol>You can also use a scanner on line-in, your own stream URL, or an audio file.`}</div>`;
}
function play(id){ if (audioEl) audioEl.pause(); audioEl = new Audio(`/clips/${id}.wav`); audioEl.play(); }
function verdict(id, v){
  const t = txs.find(x => x.id === id); if (!t) return;
  fetch("/api/verdict", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id, verdict: t.verdict === v ? null : v})});
}
function showAcc(a){ const n = a.ok + a.bad; $("#acc").textContent = n ? `${Math.round(100*a.ok/n)}% right of ${n} checked` : ""; }
$("#q").oninput = () => render();
document.querySelectorAll(".chip[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".chip[data-f]").forEach(x => x.classList.toggle("active", x === b)); render();
});

// ---------- status ----------
function showStatus(s){
  const src = s.source, m = s.model;
  $("#srcdot").className = "dot " + ({running:"ok", connecting:"warn", error:"err"}[src.state] || "");
  $("#srctxt").textContent = src.kind === "none" ? "no audio source" : `${src.kind}: ${src.msg}`;
  $("#srctxt").parentElement.title = src.msg;
  $("#mdldot").className = "dot " + ({ready:"ok", loading:"warn", error:"err"}[m.state] || "");
  $("#mdltxt").textContent = m.state === "ready" ? `model ready${s.queue > 1 ? ` · ${s.queue} queued` : ""}` : m.msg || m.state;
  $("#btnStop").hidden = src.kind === "none" && !cap;
}
let lastLevel = 0;
function showLevel(l){
  const pct = Math.min(100, Math.log10(1 + l.rms) / 4.2 * 100);
  $("#meter").firstChild.style.width = pct + "%";
  $("#meter").classList.toggle("talk", l.talking);
  lastLevel = Date.now();
}
setInterval(() => { if (Date.now() - lastLevel > 1500) $("#meter").firstChild.style.width = "0"; }, 1000);

// ---------- live events ----------
function connect(){
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "level") showLevel(m);
    else if (m.type === "traffic") { $("#acdot").className = "dot " + (m.ok ? "ok" : "err"); drawTraffic(m.ac); }
    else if (m.type === "status") showStatus(m);
    else if (m.type === "tx") {
      txs.unshift(m.tx); if (txs.length > 600) txs.pop();
      if (m.tx.hex) { talkedAt[m.tx.hex] = Date.now()/1000; if (acs[m.tx.hex] && markers[m.tx.hex]) markers[m.tx.hex].setIcon(icon(acs[m.tx.hex])); }
      render(m.tx.id); if (selected) drawCard();
    }
    else if (m.type === "verdict") { const t = txs.find(x => x.id === m.id); if (t) t.verdict = m.verdict; showAcc(m.accuracy); render(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

// ---------- browser audio capture ----------
let cap = null;
async function capture(kind){
  await stopCapture();
  let stream;
  try {
    stream = kind === "tab"
      ? await navigator.mediaDevices.getDisplayMedia({video:true, audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}})
      : await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  } catch (e) { return; }
  if (!stream.getAudioTracks().length){
    stream.getTracks().forEach(t => t.stop());
    alert("That share had no audio. Pick a browser tab and tick “Also share tab audio” (Chrome or Edge).");
    return;
  }
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule("/worklet.js");
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/audio`);
  ws.binaryType = "arraybuffer";
  await new Promise((ok, no) => { ws.onopen = ok; ws.onerror = no; });
  ws.send(JSON.stringify({rate: ctx.sampleRate, label: kind === "tab" ? "tab audio" : "mic / line-in"}));
  const node = new AudioWorkletNode(ctx, "tap"), mute = ctx.createGain();
  mute.gain.value = 0;
  node.port.onmessage = e => { if (ws.readyState === 1) ws.send(e.data.buffer); };
  ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())).connect(node).connect(mute).connect(ctx.destination);
  cap = {stream, ctx, ws};
  stream.getAudioTracks()[0].onended = stopCapture;
  $("#btnStop").hidden = false;
}
async function stopCapture(){
  if (!cap) return;
  cap.stream.getTracks().forEach(t => t.stop());
  cap.ws.close(); await cap.ctx.close(); cap = null;
}
$("#btnTab").onclick = () => capture("tab");
$("#btnMic").onclick = () => capture("mic");
$("#btnStop").onclick = async () => {
  await stopCapture();
  fetch("/api/source", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kind:"none"})});
};
$("#btnUrl").onclick = () => $("#dlg").showModal();
$("#dlgcancel").onclick = () => $("#dlg").close();
$("#dlggo").onclick = async () => {
  const v = $("#dlgval").value.trim(); if (!v) return;
  await stopCapture();
  fetch("/api/source", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({kind: /^https?:\/\//i.test(v) ? "url" : "file", value: v, fast: $("#dlgfast").checked})});
  $("#dlg").close();
};

// ---------- boot ----------
(async () => {
  const init = await (await fetch("/api/init")).json();
  cfg = init.cfg; txs = init.tx;
  for (const t of txs) if (t.hex) talkedAt[t.hex] = Math.max(talkedAt[t.hex] || 0, t.ts);
  $("#apt").textContent = `${cfg.airport} ${cfg.feed}`;
  $("#aptsub").textContent = `${cfg.airport_name} · live radio matched to flights`;
  document.title = `${cfg.airport} ATC Radar`;
  map = L.map("map", {zoomControl:true, attributionControl:true}).setView([cfg.lat, cfg.lon], 10);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:16,
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · aircraft: adsb.lol · routes: adsbdb'}).addTo(map);
  for (const nm of [5, 10, 20, cfg.radius_nm]) L.circle([cfg.lat, cfg.lon], {radius:nm*1852, color:"#2b3a45", weight:1, fill:false, interactive:false}).addTo(map);
  L.circleMarker([cfg.lat, cfg.lon], {radius:4, color:"#9be564", weight:2, fillOpacity:1, interactive:false}).addTo(map);
  $("#acdot").className = "dot " + (init.traffic_ok ? "ok" : "");
  drawTraffic(init.ac); showStatus(init.status); showAcc(init.accuracy); render(); connect();
})();
